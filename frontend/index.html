<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Panel Dust Check</title>
<style>
  :root {
    --bg: #eef1f4; --card: #ffffff; --ink: #14202b; --muted: #5d6b78; --line: #d5dce3;
    --panel: #1c3a5a; --dust: #f59e0b; --clean: #1f8a5b; --bad: #b3261e;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1720; --card: #17222e; --ink: #e8eef4; --muted: #93a3b3; --line: #2a3947; --panel: #7fb0e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  main { max-width: 920px; margin: 0 auto; padding: 32px 20px 56px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 10px; background: var(--card);
    padding: 36px 20px; text-align: center; cursor: pointer; color: var(--muted);
  }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--panel); color: var(--ink); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  button {
    margin-top: 16px; padding: 11px 22px; font: inherit; font-weight: 600; color: #fff;
    background: var(--panel); border: 0; border-radius: 8px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #0f1720; } }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, .drop:focus-within { outline: 3px solid var(--dust); outline-offset: 2px; }
  #err { color: var(--bad); margin-top: 14px; min-height: 1.2em; }
  #result { display: none; margin-top: 20px; }
  .head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .cov { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em; }
  .tag { font-weight: 600; padding: 3px 12px; border-radius: 999px; color: #fff; background: var(--clean); }
  .tag.dirty { background: var(--dust); color: #14202b; }
  .bar { height: 10px; border-radius: 6px; background: var(--line); margin: 12px 0 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--dust); transition: width .5s ease; }
  .meta { color: var(--muted); font-size: .92rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 20px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  figure img { width: 100%; display: block; border-radius: 6px; background: #000; }
  figcaption { color: var(--muted); font-size: .88rem; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Solar panel dust check</h1>
  <p class="sub">Upload a photo of a panel. The model marks the dusty area and reports how much of the image it covers.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <span id="dropText">Drop a panel photo here, or click to choose one</span>
  </label>
  <button id="go" disabled>Analyze image</button>
  <div id="err" role="alert"></div>

  <section id="result" aria-live="polite">
    <div class="head">
      <span class="cov" id="cov">0%</span>
      <span class="tag" id="tag">Clean</span>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="meta" id="meta"></div>
    <div class="grid">
      <figure><img id="orig" alt="Uploaded panel"><figcaption>Your photo</figcaption></figure>
      <figure><img id="over" alt="Dust highlighted in amber"><figcaption>Dust highlighted</figcaption></figure>
      <figure><img id="mask" alt="Dust mask"><figcaption>Dust mask (white = dust)</figcaption></figure>
    </div>
  </section>
</main>

<script>
  const API_URL = "http://127.0.0.1:8000";
  const $ = id => document.getElementById(id);
  let chosen = null;

  function pick(f) {
    if (!f || !f.type.startsWith("image/")) { $("err").textContent = "Choose an image file (JPG or PNG)."; return; }
    chosen = f; $("err").textContent = ""; $("go").disabled = false;
    $("dropText").textContent = f.name;
  }
  $("file").addEventListener("change", e => pick(e.target.files[0]));
  ["dragover", "dragenter"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, () => $("drop").classList.remove("over")));
  $("drop").addEventListener("drop", e => { e.preventDefault(); pick(e.dataTransfer.files[0]); });

  $("go").addEventListener("click", async () => {
    if (!chosen) return;
    $("go").disabled = true; $("go").textContent = "Analyzing..."; $("err").textContent = "";
    try {
      const fd = new FormData(); fd.append("file", chosen);
      const res = await fetch(API_URL + "/predict", { method: "POST", body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      show(data);
    } catch (e) {
      $("err").textContent = e instanceof TypeError
        ? "Cannot reach the backend. Start it with: python app.py (port 8000)."
        : e.message;
    } finally {
      $("go").disabled = false; $("go").textContent = "Analyze image";
    }
  });

  function show(d) {
    $("result").style.display = "block";
    $("cov").textContent = d.coverage_percent.toFixed(1) + "%";
    $("tag").textContent = d.status;
    $("tag").className = "tag" + (d.label === "dirty" ? " dirty" : "");
    $("fill").style.width = Math.min(100, d.coverage_percent) + "%";
    $("meta").textContent = "Dust covers " + d.coverage_percent.toFixed(1) + "% of the image. Model confidence on dust pixels: " + d.confidence.toFixed(0) + "%.";
    $("orig").src = URL.createObjectURL(chosen);
    $("over").src = "data:image/png;base64," + d.overlay_png_base64;
    $("mask").src = "data:image/png;base64," + d.mask_png_base64;
  }
</script>
</body>
</html>
